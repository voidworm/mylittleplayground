apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-pokeapi
spec:
  replicas: {{ .Values.pokeapi.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-pokeapi
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-pokeapi
    spec:
      initContainers:
        - name: fetch-csv-data
          image: alpine/git:latest
          command:
            - sh
            - -c
            - |
              git clone --depth 1 --branch 2.9.0 --filter=blob:none --sparse https://github.com/PokeAPI/pokeapi.git /tmp/repo
              cd /tmp/repo
              git sparse-checkout set data/v2/csv
              cp -r data/v2/csv/. /csv-data/
          volumeMounts:
            - name: csv-data
              mountPath: /csv-data
      containers:
        - name: pokeapi
          image: {{ .Values.pokeapi.image }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}-db
          env:
            - name: POSTGRES_HOST
              value: {{ .Release.Name }}-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_CONNECTION_STRING
              value: redis://{{ .Release.Name }}-redis:6379/0
          ports:
            - containerPort: 80
          volumeMounts:
            - name: csv-data
              mountPath: /code/data/v2/csv
          readinessProbe:
            httpGet:
              path: /api/v2/pokemon/1
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: csv-data
          emptyDir: {}